<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Recent Discoveries — Al Ain National Museum</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/libs/three.module.js",
          "three/addons/": "./assets/libs/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage">
      <div id="app">
        <!-- HOME PAGE -->
        <div class="page active" id="home">
          <!-- logo stays on top through the reveal; click cue fades out on tap -->
          <img
            class="home-logo"
            src="assets/media/logo.png"
            alt="Recent Discoveries — أحدث الاكتشافات"
            draggable="false"
          />
          <img
            id="tapCue"
            class="home-click"
            src="assets/media/clickicon.png"
            alt="Tap to reveal the discovery"
            draggable="false"
          />

          <!-- the discovery, revealed in place when the screen is tapped -->
          <canvas id="homeGl"></canvas>
          <img id="homeFallback" alt="Stone Door artifact" />

          <div
            class="home-btns"
            id="homeBtns"
            style="opacity: 0; pointer-events: none; transition: opacity 0.5s"
          >
            <button
              class="btn-pill"
              id="startAr"
              style="direction: rtl; font-size: 15px"
            >
              ابدأ الاستكشاف
            </button>
            <button class="btn-pill" id="startEn">START EXPLORING</button>
          </div>
        </div>

        <!-- OBJECT PAGE -->
        <div class="page" id="object-page">
          <div class="obj-header">
            <button class="back-btn" data-back>←</button>
            <img
              class="header-logo"
              src="assets/media/logo.png"
              alt="Recent Discoveries — أحدث الاكتشافات"
              draggable="false"
            />
          </div>
          <div class="obj-stage">
            <canvas id="objGl"></canvas>
            <img id="objFallback" alt="Stone Door" draggable="false" />
            <div class="drag-hint" data-i18n="dragHint">↔ Drag to rotate</div>
          </div>
          <div class="obj-body">
            <div class="obj-name" id="objName">
              The Stone Door of an Ancient Tomb
            </div>
            <div class="divider"></div>
            <div class="meta">
              <span class="meta-k" data-i18n="kDate">Age</span
              ><span class="meta-v" id="vDate">More than 4,300 years old</span>
            </div>
            <div class="meta">
              <span class="meta-k" data-i18n="kMaterial">Material</span
              ><span class="meta-v" id="vMaterial"
                >Limestone, Jebel Haqlah</span
              >
            </div>
            <div class="divider"></div>
            <button class="story-btn" id="toStory" data-i18n="storyBtn">
              DISCOVER THE STORY
            </button>
          </div>
        </div>

        <!-- STORY PAGE -->
        <div class="page" id="story-page">
          <div class="story-header">
            <div class="brand" data-i18n="brandStory">The Story</div>
          </div>

          <div class="timeline">
            <div class="t-step">
              <div class="t-dot on" data-story="0">1</div>
              <div class="t-label" data-i18n="tl0">Quarried</div>
            </div>
            <div class="t-line"></div>
            <div class="t-step">
              <div class="t-dot" id="td1" data-story="1">2</div>
              <div class="t-label" data-i18n="tl1">Carved</div>
            </div>
            <div class="t-line"></div>
            <div class="t-step">
              <div class="t-dot" id="td2" data-story="2">3</div>
              <div class="t-label" data-i18n="tl2">Placed</div>
            </div>
            <div class="t-line"></div>
            <div class="t-step">
              <div class="t-dot" id="td3" data-story="3">4</div>
              <div class="t-label" data-i18n="tl3">Lives on</div>
            </div>
          </div>

          <div class="story-vis">
            <svg
              id="storyVis"
              width="200"
              height="184"
              viewBox="0 0 200 184"
            ></svg>
            <img
              id="storyImg"
              src="assets/media/tomb.jpeg"
              alt=""
              draggable="false"
            />
            <div class="img-cap" id="imgCap" data-i18n="imgCap1">
              A photo of Hili Grand Tomb for comparison only.
            </div>
            <div class="story-video" id="storyVideo" style="display: none">
              <div class="vid-wrap" id="vidWrap">
                <video
                  id="vid"
                  playsinline
                  webkit-playsinline
                  preload="metadata"
                  muted
                  loop
                >
                  <source src="assets/media/interview.mp4" type="video/mp4" />
                </video>
                <button
                  class="vid-play"
                  id="vidPlay"
                  aria-label="Play or pause"
                ></button>
                <button
                  class="vid-btn vid-mute"
                  id="vidMute"
                  aria-label="Toggle sound"
                ></button>
                <button
                  class="vid-btn vid-full"
                  id="vidFull"
                  aria-label="Toggle fullscreen"
                ></button>
              </div>
            </div>
          </div>

          <div class="story-body">
            <div class="story-title" id="storyTitle">
              The quarry at Jebel Haqlah
            </div>
            <div class="story-text" id="storyText"></div>
            <div class="story-nav">
              <button class="nav-btn" id="storyPrev">←</button>
              <div class="dots">
                <div class="dot on" id="sd0"></div>
                <div class="dot" id="sd1"></div>
                <div class="dot" id="sd2"></div>
                <div class="dot" id="sd3"></div>
              </div>
              <button class="nav-btn" id="storyNext">→</button>
            </div>
          </div>
          <button
            class="btn-pill story-start"
            data-back="home"
            data-i18n="backHome"
          >
            BACK TO HOME SCREEN
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
